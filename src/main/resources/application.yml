spring:
  application:
    name: mcp-dev-tooling
  main:
    banner-mode: off
    web-application-type: none
  ai:
    mcp:
      server:
        name: mcp-dev-tooling
        version: 0.1.0
        # ASYNC: the adapter owns deadlines/cancellation; the SDK's sync bridge
        # cannot express either (it runs tools on boundedElastic platform threads).
        type: ASYNC
        stdio: true
        # Must exceed mcp.executor.call-timeout-millis so OUR deadline fires first.
        request-timeout: 35s
        annotation-scanner:
          enabled: false

mcp:
  fs:
    # Absolute roots the FS tools may touch; env override: MCP_FS_ROOTS=/repo/one,/repo/two
    roots: ${MCP_FS_ROOTS:}
    # Explicit, security-relevant: do NOT rely on @DefaultValue at bind time.
    ignore: [.git, node_modules, target, build, dist, out, .idea, .vscode, __pycache__, .venv, venv, bin, obj]
    max-file-bytes: 1048576
    max-lines: 2000
    max-list-entries: 500
    max-list-depth: 3
    max-search-matches: 100
    max-search-files: 2000
    max-search-file-bytes: 524288
    max-search-line-length: 1000
    search-deadline-millis: 5000
  db:
    # Empty url = DB tools disabled. Env override is the intended setup:
    # MCP_DB_URL=jdbc:postgresql://localhost:5432/mydb MCP_DB_USER=... MCP_DB_PASSWORD=...
    # IMPORTANT: use a READ-ONLY database role — that is the authoritative boundary.
    url: ${MCP_DB_URL:}
    username: ${MCP_DB_USER:}
    password: ${MCP_DB_PASSWORD:}
    max-pool-size: ${MCP_DB_MAX_POOL_SIZE:5}
    query-timeout-seconds: 10
    max-rows: 500
    max-render-rows: 50
    max-cell-length: 120
  security:
    # Caller role for the stdio transport. Unknown values fail startup loudly.
    role: ${MCP_ROLE:VIEWER}
    # tool -> role; may only NARROW (raise) the code-owned floor, never widen.
    permission-overrides: {}
    rate-limit-capacity: ${MCP_RATE_LIMIT_CAPACITY:30}
    rate-limit-refill-per-second: ${MCP_RATE_LIMIT_REFILL:10}
    max-args-bytes: 65536
    audit-file: ${MCP_AUDIT_FILE:}
  executor:
    # Phase 6 target: 1,000+ concurrent calls. Permits bound in-flight + queued work.
    max-concurrent-calls: ${MCP_MAX_CONCURRENT_CALLS:2048}
    queue-wait-millis: ${MCP_QUEUE_WAIT_MILLIS:5000}
    # One end-to-end deadline per call (queue + execution). DB statement timeout is 10s.
    call-timeout-millis: ${MCP_CALL_TIMEOUT_MILLIS:30000}
    # Executor gauges to stderr every N seconds (0 = off) — load-test evidence.
    stats-interval-seconds: ${MCP_STATS_INTERVAL_SECONDS:0}
  transport:
    # stdio (default) or http. The http profile overrides this to "http" and
    # swaps in Streamable HTTP; see application-http.yml.
    mode: stdio
    # Inbound JSON-RPC lines are capped before allocation.
    max-line-chars: ${MCP_MAX_LINE_CHARS:1048576}
